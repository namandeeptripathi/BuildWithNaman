<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naman Deep Tripathi — Software Developer / AI·ML Engineer</title>
    <meta name="description" content="Building practical software products and exploring intelligent solutions to real-world problems." />

    <!-- Theme Color for Dark and Light ground -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1310" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEFE8" />

    <!-- Canonical URL -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Naman Deep Tripathi — Software Developer / AI·ML Engineer" />
    <meta property="og:description" content="Building practical software products and exploring intelligent solutions to real-world problems." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Naman Deep Tripathi — Software Developer / AI·ML Engineer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naman Deep Tripathi — Software Developer / AI·ML Engineer" />
    <meta name="twitter:description" content="Building practical software products and exploring intelligent solutions to real-world problems." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

    <!-- Schema.org Person JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Naman Deep Tripathi",
      "jobTitle": "Software Developer / AI/ML Engineer",
      "url": "%VITE_SITE_URL%/",
      "sameAs": [
        "https://github.com/namandeeptripathi",
        "https://www.linkedin.com/in/naman-deep-tripathi-2709a6286/"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mathura",
        "addressCountry": "India"
      }
    }
    </script>

    <!-- Google Fonts: Bodoni Moda (400, 500, italic 500), Hanken Grotesk (400, 500), DM Mono (400, 500) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..500;1,6..96,500&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Restore saved theme before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ndt-theme');
          if (saved === 'light' || saved === 'dark')
            document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; text-align: center; background: #0A1310; color: #E9E4D6; font-family: system-ui, sans-serif; border-bottom: 1px solid #C8A25E;">
        This portfolio utilizes JavaScript for interactive motion, 3D graphics, and dynamic contact workflows. Please enable JavaScript for the full experience.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
