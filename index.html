<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naman Deep Tripathi — Software Developer / AI·ML Engineer</title>
    <meta name="description" content="Portfolio of Naman Deep Tripathi — Software Developer and AI/ML Engineer based in Mathura, India. Building practical software products and exploring intelligent solutions." />

    <!-- Google Fonts: Bodoni Moda, Hanken Grotesk, DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Restore saved theme before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ndt-theme');
          if (saved === 'light' || saved === 'dark')
            document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
