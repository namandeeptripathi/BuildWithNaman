<!-- Standalone Apple Touch Icon Generator (180x180) -->
<!-- Regeneration command:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
       --headless \
       --disable-gpu \
       --hide-scrollbars \
       --window-size=180,180 \
       --force-device-scale-factor=1 \
       --virtual-time-budget=5000 \
       --screenshot="public/apple-touch-icon.png" \
       "file://$(pwd)/tools/og/apple-touch-icon-template.html"
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple Touch Icon Generator — NDT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 180px;
      height: 180px;
      background: #0A1310;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .monogram {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 76px;
      color: #C8A25E;
      letter-spacing: 0.04em;
      line-height: 1;
      text-align: center;
      padding-top: 4px;
    }
  </style>
</head>
<body>
  <div class="monogram">NDT</div>
</body>
</html>
