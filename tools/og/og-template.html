<!-- Standalone OG Image Generator -->
<!-- Regeneration command:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
       --headless \
       --disable-gpu \
       --hide-scrollbars \
       --window-size=1200,630 \
       --force-device-scale-factor=1 \
       --virtual-time-budget=5000 \
       --screenshot="public/og.png" \
       "file://$(pwd)/tools/og/og-template.html"
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Image Generator — NDT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1200px;
      height: 630px;
      background: #0A1310;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 110px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .name {
      font-family: 'Bodoni Moda', 'Didot', Georgia, serif;
      font-size: 84px;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: #E9E4D6;
    }
    .name em {
      font-style: italic;
      color: #C8A25E;
    }
    .rule {
      width: 160px;
      height: 1px;
      background: #C8A25E;
    }
    .role {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #93A398;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="name">Naman <em>Deep</em> Tripathi</h1>
    <div class="rule"></div>
    <p class="role">Software Developer / AI-ML Engineer</p>
  </div>
</body>
</html>
